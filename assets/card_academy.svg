<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Fondo -->
    <radialGradient id="bgGlowAcad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="1"/>
    </radialGradient>

    <!-- Gradientes de Libro / Pergamino -->
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="48%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="52%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Gradientes Dorados -->
    <linearGradient id="goldAcadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Gradientes de Alfil (Pieza Central) -->
    <linearGradient id="bishopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <filter id="softShadowAcad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo de Estudio -->
  <rect width="600" height="340" fill="url(#bgGlowAcad)"/>

  <!-- Halo de Aprendizaje Cálido -->
  <circle cx="300" cy="155" r="130" fill="#eab308" opacity="0.08"/>

  <!-- Laureles de Maestría y Estudio (Corona Clásica a los Lados) -->
  <g stroke="url(#goldAcadGrad)" stroke-width="1.8" fill="none" opacity="0.75">
    <!-- Rama Izquierda -->
    <path d="M210,210 C180,180 180,110 220,70"/>
    <g fill="url(#goldAcadGrad)" stroke="none">
      <ellipse cx="196" cy="180" rx="7" ry="3.5" transform="rotate(-30 196 180)"/>
      <ellipse cx="186" cy="150" rx="7" ry="3.5" transform="rotate(-15 186 150)"/>
      <ellipse cx="188" cy="120" rx="7" ry="3.5" transform="rotate(10 188 120)"/>
      <ellipse cx="202" cy="92" rx="7" ry="3.5" transform="rotate(35 202 92)"/>
      <ellipse cx="222" cy="72" rx="6" ry="3" transform="rotate(55 222 72)"/>
    </g>
    <!-- Rama Derecha -->
    <path d="M390,210 C420,180 420,110 380,70"/>
    <g fill="url(#goldAcadGrad)" stroke="none">
      <ellipse cx="404" cy="180" rx="7" ry="3.5" transform="rotate(30 404 180)"/>
      <ellipse cx="414" cy="150" rx="7" ry="3.5" transform="rotate(15 414 150)"/>
      <ellipse cx="412" cy="120" rx="7" ry="3.5" transform="rotate(-10 412 120)"/>
      <ellipse cx="398" cy="92" rx="7" ry="3.5" transform="rotate(-35 398 92)"/>
      <ellipse cx="378" cy="72" rx="6" ry="3" transform="rotate(-55 378 72)"/>
    </g>
  </g>

  <!-- ==================== LIBRO ABIERTO DE AJEDREZ ==================== -->
  <g transform="translate(300, 210)" filter="url(#softShadowAcad)">
    <!-- Cubierta del Libro (Borde Inferior) -->
    <path d="M-135,10 Q0,-6 135,10 L140,24 Q0,8 -140,24 Z" fill="url(#bookCoverGrad)" stroke="url(#goldAcadGrad)" stroke-width="1.5"/>
    
    <!-- Páginas del Libro Abierto -->
    <path d="M-130,6 Q-65,-12 0,4 Q65,-12 130,6 L132,18 Q65,0 0,16 Q-65,0 -132,18 Z" 
          fill="url(#pageGrad)" stroke="#94a3b8" stroke-width="0.8"/>

    <!-- Diagrama Mini de Tablero Táctico en la Página Izquierda -->
    <g transform="translate(-65, -3) scale(0.65)" opacity="0.6">
      <rect x="-30" y="-18" width="60" height="36" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <rect x="-30" y="-18" width="15" height="9" fill="#94a3b8"/>
      <rect x="0" y="-18" width="15" height="9" fill="#94a3b8"/>
      <rect x="-15" y="-9" width="15" height="9" fill="#94a3b8"/>
      <rect x="15" y="-9" width="15" height="9" fill="#94a3b8"/>
      <rect x="-30" y="0" width="15" height="9" fill="#94a3b8"/>
      <rect x="0" y="0" width="15" height="9" fill="#94a3b8"/>
      <rect x="-15" y="9" width="15" height="9" fill="#94a3b8"/>
      <rect x="15" y="9" width="15" height="9" fill="#94a3b8"/>
    </g>

    <!-- Líneas de Notación / Texto de Estudio en la Página Derecha -->
    <g stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
      <line x1="35" y1="-8" x2="95" y2="-12"/>
      <line x1="35" y1="-1" x2="88" y2="-5"/>
      <line x1="35" y1="6" x2="92" y2="2"/>
    </g>
  </g>

  <!-- ==================== PIEZA DE AJEDREZ: ALFIL DE LA ACADEMIA ==================== -->
  <g transform="translate(300, 65)" filter="url(#softShadowAcad)">
    <!-- Base del Alfil -->
    <g transform="translate(0, 120)">
      <ellipse cx="0" cy="18" rx="36" ry="10" fill="url(#bishopGrad)" stroke="url(#goldAcadGrad)" stroke-width="1"/>
      <path d="M-26,4 C-26,0 -16,-2 0,-2 C16,-2 26,0 26,4 L30,16 C30,20 16,22 0,22 C-16,22 -30,20 -30,16 Z" 
            fill="url(#bishopGrad)" stroke="#94a3b8" stroke-width="0.8"/>
      <ellipse cx="0" cy="4" rx="26" ry="5.5" fill="none" stroke="url(#goldAcadGrad)" stroke-width="1.5"/>
    </g>

    <!-- Cuerpo / Columna del Alfil -->
    <path d="M-12,48 C-13,75 -20,105 -24,124 C-14,128 14,128 24,124 C20,105 13,75 12,48 Z" 
          fill="url(#bishopGrad)" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Anillo Central con Ribete Dorado -->
    <ellipse cx="0" cy="48" rx="16" ry="4.5" fill="url(#bishopGrad)" stroke="url(#goldAcadGrad)" stroke-width="1.5"/>

    <!-- Mitra / Cabeza del Alfil Clásico -->
    <path d="M-16,46 C-22,25 -18,2 0,0 C18,2 22,25 16,46 Z" 
          fill="url(#bishopGrad)" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Ranura / Muesca Diagonal Típica del Alfil -->
    <path d="M-5,16 L12,8 L10,12 L-4,20 Z" fill="#0f172a"/>

    <!-- Esfera Superior del Alfil -->
    <circle cx="0" cy="-2" r="5" fill="url(#goldAcadGrad)" stroke="#854d0e" stroke-width="0.8"/>
    <circle cx="-1.5" cy="-3.5" r="1.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Pequeño birrete o insignia académica dorada sutil sobre el alfil -->
  <g transform="translate(300, 50)">
    <!-- Diamante birrete sutil -->
    <path d="M0,-16 L18,-11 L0,-6 L-18,-11 Z" fill="url(#goldAcadGrad)" stroke="#78350f" stroke-width="0.6"/>
    <!-- Borla dorada -->
    <path d="M12,-10 Q16,-2 14,8" fill="none" stroke="#fef08a" stroke-width="1.2"/>
    <circle cx="14" cy="9" r="1.5" fill="#fef08a"/>
  </g>
</svg>
