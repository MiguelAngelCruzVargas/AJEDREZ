<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Fondo -->
    <radialGradient id="bgGlowAI" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="haloAI" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradientes del Rey de Ajedrez -->
    <linearGradient id="goldKingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <linearGradient id="darkPieceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="lightShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo de Escenario de Estudio -->
  <rect width="600" height="340" fill="url(#bgGlowAI)"/>
  
  <!-- Patrón de Tablero Isométrico Sutil en el Suelo -->
  <g opacity="0.12" transform="translate(300, 260) scale(1, 0.42)">
    <circle r="220" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="6,8"/>
    <circle r="160" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <circle r="100" fill="none" stroke="#eab308" stroke-width="1"/>
  </g>

  <!-- Halo de Inteligencia Digital Sutil Detrás del Rey -->
  <ellipse cx="300" cy="150" rx="140" ry="110" fill="url(#haloAI)"/>

  <!-- Pedestal / Base de Casilla de Ajedrez -->
  <g transform="translate(300, 265)">
    <!-- Sombra en el suelo -->
    <ellipse cx="0" cy="8" rx="85" ry="24" fill="#000000" opacity="0.6" filter="url(#softShadow)"/>
    <!-- Casilla Base Estilizada -->
    <path d="M-70,0 L0,-18 L70,0 L0,18 Z" fill="#1e293b" stroke="#ca8a04" stroke-width="1.5"/>
    <path d="M-70,0 L0,18 L0,26 L-70,8 Z" fill="#0f172a" stroke="#ca8a04" stroke-width="0.8"/>
    <path d="M0,18 L70,0 L70,8 L0,26 Z" fill="#090d16" stroke="#ca8a04" stroke-width="0.8"/>
  </g>

  <!-- PIEZA DE AJEDREZ: REY CLÁSICO ESTILIZADO -->
  <g transform="translate(300, 50)" filter="url(#softShadow)">
    <!-- Cruz Superior del Rey -->
    <g fill="url(#goldKingGrad)" stroke="#78350f" stroke-width="0.5">
      <path d="M-3,5 H3 V11 H8 V17 H3 V25 H-3 V17 H-8 V11 H-3 Z" />
      <circle cx="0" cy="14" r="2.5" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Corona del Rey -->
    <!-- Cúpula y Arcos -->
    <path d="M-22,38 C-22,26 -12,25 0,25 C12,25 22,26 22,38 C22,46 16,50 0,50 C-16,50 -22,46 -22,38 Z" 
          fill="url(#goldKingGrad)" stroke="#854d0e" stroke-width="1"/>
    
    <!-- Puntas / Filigrana de la Corona -->
    <path d="M-20,38 Q-10,30 0,38 Q10,30 20,38 L16,48 L-16,48 Z" fill="#ca8a04" opacity="0.6"/>

    <!-- Anillo / Cuello de la Corona -->
    <path d="M-18,48 C-18,46 -10,45 0,45 C10,45 18,46 18,48 L15,58 C15,60 8,61 0,61 C-8,61 -15,60 -15,58 Z" 
          fill="url(#darkPieceGrad)" stroke="url(#goldKingGrad)" stroke-width="1.2"/>

    <!-- Cuerpo Principal / Columna del Rey -->
    <path d="M-15,58 C-16,90 -26,130 -30,155 C-30,165 -15,170 0,170 C15,170 30,165 30,155 C26,130 16,90 15,58 Z" 
          fill="url(#darkPieceGrad)" stroke="#475569" stroke-width="1"/>
    
    <!-- Brillo / Reflejo en el cuerpo de la pieza -->
    <path d="M-10,62 C-11,92 -20,130 -22,154 C-15,158 -5,160 0,160 C-8,150 -12,110 -8,62 Z" 
          fill="url(#lightShine)" opacity="0.35"/>

    <!-- Anillos Dorados Ornamentales del Cuerpo -->
    <ellipse cx="0" cy="115" rx="19" ry="5.5" fill="none" stroke="url(#goldKingGrad)" stroke-width="2"/>
    <ellipse cx="0" cy="148" rx="26" ry="6" fill="none" stroke="url(#goldKingGrad)" stroke-width="1.5"/>

    <!-- Moldura de la Base -->
    <path d="M-34,168 C-34,160 -20,158 0,158 C20,158 34,160 34,168 L40,192 C40,200 24,204 0,204 C-24,204 -40,200 -40,192 Z" 
          fill="url(#darkPieceGrad)" stroke="url(#goldKingGrad)" stroke-width="1.5"/>

    <!-- Reborde Inferior de la Base con Bisel Dorado -->
    <path d="M-44,194 C-44,188 -26,186 0,186 C26,186 44,188 44,194 L44,206 C44,213 26,216 0,216 C-26,216 -44,213 -44,206 Z" 
          fill="url(#goldKingGrad)" stroke="#78350f" stroke-width="1"/>
    
    <ellipse cx="0" cy="195" rx="43" ry="8" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Partículas / Chispas Sutiles de Éxito -->
  <g fill="#fef08a" opacity="0.6">
    <circle cx="210" cy="100" r="2"/>
    <circle cx="390" cy="110" r="1.5"/>
    <circle cx="230" cy="180" r="1.8"/>
    <circle cx="375" cy="190" r="2.2"/>
    <circle cx="300" cy="35" r="2.5" fill="#38bdf8"/>
  </g>
</svg>
